# SEM vignettes use the tested medfit build from Data-Wise R-universe.
name: R-CMD-check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://data-wise.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # RMediation 1.11.1 fails S4 union registration under S7 1.0.0.
          extra-packages: any::rcmdcheck, RMediation@1.6.1
          needs: check

      - name: Verify SEM provider version
        run: stopifnot(packageVersion("medfit") == "0.20.0")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
