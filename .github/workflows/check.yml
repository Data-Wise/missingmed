# Standard r-lib/actions R-CMD-check. Installs current deps via pak, all from
# CRAN (medfit and RMediation are on CRAN; DESCRIPTION has no Remotes: or
# Additional_repositories:).
name: R-CMD-check

# No pull_request trigger: PRs are gated by dev/local-ci.sh (run locally).
on:
  push:
    branches: [main, dev]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
