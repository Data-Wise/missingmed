# SEM vignettes need a newer medfit than the package's general CRAN floor.
name: R-CMD-check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, github::Data-Wise/medfit@e068d7506c6263dcda7f5485c09f892249165fbf
          needs: check

      - name: Verify SEM provider version
        run: stopifnot(packageVersion("medfit") == "0.15.0")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
