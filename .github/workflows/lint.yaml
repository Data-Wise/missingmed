# lintr on R/ (config in .lintr: line length 110; object-name and indentation
# linters off to match the house style; tests, vignettes, data-raw, inst and
# dev excluded). Fails the build on any lint. Restores the lint step dropped in
# the v0.2.0 workflow modernization (#87).
name: lint

on:
  push:
    branches: [main, dev]

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://data-wise.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::., RMediation@1.11.2, S7@1.0.0, github::Data-Wise/medfit@4739e8e76020cd7d0e5f8f29e9d918c6dd4e6ef8
          needs: lint

      - name: Verify release dependency versions
        run: |
          stopifnot(packageVersion("RMediation") == "1.11.2",
                    packageVersion("S7") == "1.0.0",
                    packageVersion("medfit") == "0.20.0")
        shell: Rscript {0}

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
