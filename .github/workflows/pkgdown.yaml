# Build and deploy the pkgdown site to GitHub Pages.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://data-wise.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., RMediation@1.11.2, S7@1.0.0, github::Data-Wise/medfit@4739e8e76020cd7d0e5f8f29e9d918c6dd4e6ef8
          needs: website

      - name: Verify release dependency versions
        run: |
          stopifnot(packageVersion("RMediation") == "1.11.2",
                    packageVersion("S7") == "1.0.0",
                    packageVersion("medfit") == "0.20.0")
        shell: Rscript {0}

      - name: Remove dev-only markdown from the site build
        # pkgdown renders every root *.md as a page and has no exclude hook
        # (pkgdown:::package_mds ignores .Rbuildignore), so drop dev docs here.
        run: rm -f CLAUDE.md MIGRATION_NOTES.md README.dev.md ORCHESTRATE-*.md

      - name: Build site
        # dest_dir matches _pkgdown.yml `destination:` (docs/ holds specs, not the site)
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, dest_dir = "pkgdown-site")
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        # Publish only from main (push) or a published release. Pushes to dev
        # and manual runs from other branches still build the site, so a broken
        # build is caught, but they no longer overwrite the public site.
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: pkgdown-site
